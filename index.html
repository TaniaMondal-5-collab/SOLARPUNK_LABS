<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ASTROBASE: Junior Astronaut Mission Trainer - 3D Space Simulation Game for NASA Space Apps Challenge 2026">
  <title>ASTROBASE: Junior Astronaut Mission Trainer (3D Space Simulator)</title>

  <!-- Google Fonts: Orbitron (Cinematic Titles), Rajdhani (HUD/Body), JetBrains Mono (Telemetry) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Core Game Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 3D WebGL Simulation Canvas Container -->
  <div id="canvas-3d"></div>

  <!-- React UI / HUD / Menu Root Layer -->
  <div id="ui-root"></div>

  <!-- 1. Bundled Local Three.js 3D Game Engine (Zero external dependencies) -->
  <script src="three.min.js"></script>

  <!-- 2. Synthesized Space Audio Engine -->
  <script src="audio.js"></script>

  <!-- 3. Curriculum Game Data & NASA Mission Scenarios -->
  <script src="gameData.js"></script>

  <!-- 4. Three.js 3D Lunar World, Astronaut Controller & Physics Engine -->
  <script src="game3d.js"></script>

  <!-- 5. Offline React Fallback Engine -->
  <script src="reactShim.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- 6. Main React UI & Game Campaign Manager -->
  <script src="app.js"></script>
</body>
</html>
