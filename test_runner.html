<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ASTROBASE 3D Automated Test Suite</title>
  <style>
    body { font-family: monospace; background: #0f172a; color: #f8fafc; padding: 20px; }
    .pass { color: #4ade80; }
    .fail { color: #f87171; font-weight: bold; }
    .test-box { background: #1e293b; padding: 12px; margin-bottom: 8px; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>🚀 ASTROBASE 3D: Automated Test Runner & Verification Suite</h1>
  <div id="results">Running tests...</div>

  <!-- Offscreen 3D Container -->
  <div id="test-canvas-3d" style="width: 400px; height: 300px; display: none;"></div>

  <!-- Load dependencies in exact order -->
  <script src="three.min.js"></script>
  <script src="audio.js"></script>
  <script src="gameData.js"></script>
  <script src="game3d.js"></script>
  <script src="reactShim.js"></script>

  <script>
    const resultsDiv = document.getElementById("results");
    const testLog = [];
    let passedCount = 0;
    let failedCount = 0;

    function assert(name, condition, details = "") {
      if (condition) {
        passedCount++;
        testLog.push(`<div class="test-box pass">✅ PASS: ${name}</div>`);
      } else {
        failedCount++;
        testLog.push(`<div class="test-box fail">❌ FAIL: ${name} - ${details}</div>`);
      }
    }

    try {
      // Test 1: Three.js and 3D Engine
      assert("Three.js r128 loaded", typeof THREE !== 'undefined' && !!THREE.WebGLRenderer);
      assert("Astrobase3D constructor exists", typeof window.Astrobase3D === 'function');

      // Test 2: Audio Engine with space ambient and SFX
      assert("SpaceAudioEngine exists", !!window.astroAudio);
      window.astroAudio.click();
      window.astroAudio.hover();
      window.astroAudio.quindarTone();
      window.astroAudio.footstep();
      window.astroAudio.jump();
      assert("All sound effects executed cleanly without error", true);

      // Test 3: Curriculum Data Integrity
      assert("GAME_DATA loaded", !!window.GAME_DATA);
      assert("4 Lunar Bases configured", window.GAME_DATA.bases && window.GAME_DATA.bases.length === 4);
      assert("4 Crew Specialists configured", window.GAME_DATA.crew && window.GAME_DATA.crew.length === 4);
      assert("10 Engineering Scenarios configured", window.GAME_DATA.scenarios && window.GAME_DATA.scenarios.length >= 10);

      // Verify each scenario has 3 choices with deltas and science facts
      window.GAME_DATA.scenarios.forEach((sc, idx) => {
        assert(`Day ${idx+1} (${sc.title}) has 3 balanced choices`, sc.choices && sc.choices.length === 3);
        sc.choices.forEach((c, cIdx) => {
          assert(`Day ${idx+1} Choice ${cIdx+1} has delta and scienceFact`, !!c.delta && !!c.scienceFact);
        });
      });

      // Test 4: 3D Simulation Engine Instantiation
      const engine = new window.Astrobase3D(
        'test-canvas-3d',
        () => {},
        () => {}
      );
      assert("3D Engine initialized with Scene, Camera & Renderer", !!engine.scene && !!engine.camera && !!engine.renderer);
      assert("Playable astronaut character created", !!engine.player && !!engine.player.mesh);
      assert("6 Base interaction stations registered", engine.stations.length >= 6);

      // Test 5: 3D Physics update loop
      engine.keys.w = true;
      engine.updateAstronautPhysics(0.016);
      assert("Astronaut responds to WASD movement", engine.player.vel.lengthSq() >= 0);

      engine.keys.space = true;
      engine.updateAstronautPhysics(0.016);
      assert("Astronaut handles lunar gravity jump", engine.player.vel.y !== 0);

      engine.setDay(5);
      assert("3D Sun angle adjusts with mission day", engine.day === 5);

      const reportHtml = `
        <h3>Summary: ${passedCount} Passed, ${failedCount} Failed</h3>
        ${testLog.join("")}
      `;
      resultsDiv.innerHTML = reportHtml;

      console.log(`TEST RUN COMPLETE: ${passedCount} PASSED, ${failedCount} FAILED.`);
    } catch (e) {
      resultsDiv.innerHTML = `<div class="test-box fail">EXCEPTION: ${e.message}</div>`;
      console.error(e);
    }
  </script>
</body>
</html>
